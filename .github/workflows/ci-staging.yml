name: CI/CD for Staging

on:
  push:
    branches:
      - staging

jobs:
  build:
    name: Build and Push Docker Image (staging)
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Đăng nhập Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 3. (Tùy chọn) Dùng GitHub Token để thực hiện các thao tác khác
      - name: Use GitHub Token
        run: echo "GitHub token hợp lệ: ${{ secrets.TOKEN_GITHUB }}"

      # 4. Build Docker image
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USER }}/ci-cd-staging-demo:staging .

      # 5. Push Docker image
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USER }}/ci-cd-staging-demo:staging
