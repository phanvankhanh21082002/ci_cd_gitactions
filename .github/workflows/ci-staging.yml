name: CI/CD for Staging

# ✅ Trigger khi có code push lên branch staging
on:
  push:
    branches:
      - staging

jobs:
  build:
    name: Build and Push Docker Image (staging)
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Đăng nhập Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 3. Build Docker image (tag theo branch staging)
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USER }}/ci-cd-staging-demo:staging .

      # 4. Push Docker image lên Docker Hub
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USER }}/ci-cd-staging-demo:staging
