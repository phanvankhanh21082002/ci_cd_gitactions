name: CI/CD for Staging

on:
  push:
    branches:
      - staging

jobs:
  build:
    name: Build and Push Docker Image (staging)
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Đăng nhập Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
          
      # 4. Build Docker image
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USER }}/ci-cd-staging-demo:staging .

      # 5. Push Docker image
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USER }}/ci-cd-staging-demo:staging

      - name: Run Docker container
        run: |
          docker run -d -p 3000:3000 --name staging-app ${{ secrets.DOCKER_USER }}/ci-cd-staging-demo:staging
          echo "Container đang chạy, kiểm tra cổng 3000 nội bộ..."
          docker ps -a
